# azure-pipelines.yml

trigger:
- main

jobs:
- job: TestMatrix
  displayName: 'Run Tests on Matrix'
  strategy:
    matrix:
      Linux_Python310:
        vmImage: 'ubuntu-latest'
        python.version: '3.10'
      Linux_Python312_Fails:
        vmImage: 'ubuntu-latest'
        python.version: '3.12'

  pool:
    vmImage: $(vmImage)

  steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(python.version)'
    displayName: 'Use Python $(python.version)'

  - script: |
      python -m pip install --upgrade pip
      pip install numpy
    displayName: 'Install dependencies'

  - script: |
      if [[ "$(python.version)" == "3.12" ]]; then
        echo "This job is configured to fail."
        exit 1
      fi
      echo "This job succeeded."
      python -c "import numpy"
    displayName: 'Run Import Test'

- job: PublishResults
  displayName: 'Check Matrix Status & Publish'
  dependsOn: TestMatrix
  condition: always()

  pool:
    vmImage: 'ubuntu-latest'

  steps:
  - script: |
      echo "--- Checking Overall Matrix Status ---"
      MATRIX_STATUS="$(dependencies.TestMatrix.result)"
      echo "Overall status of the TestMatrix job is: $MATRIX_STATUS"

      echo ""
      echo "--- Checking Individual Job Statuses ---"

      STATUS_PY310_LINUX="$(dependencies.TestMatrix.Linux_Python310.result)"
      STATUS_PY312_FAIL="$(dependencies.TestMatrix.Linux_Python312_Fails.result)"

      echo "Status of Linux_Python310: $STATUS_PY310_LINUX"
      echo "Status of Linux_Python312_Fails: $STATUS_PY312_FAIL"

      echo ""
      echo "--- Making a decision based on status ---"
      if [[ "$MATRIX_STATUS" == "Failed" ]]; then
        echo "At least one job in the matrix failed. Aborting publish."
        echo "##vso[task.complete result=Failed;]One or more matrix tests failed."
        exit 1
      elif [[ "$MATRIX_STATUS" == "SucceededWithIssues" ]]; then
        echo "Some tests passed but there were issues. Proceeding with caution."
      else
        echo "All matrix jobs succeeded! Proceeding with release."
      fi
    displayName: 'Analyze Matrix Results'