# CUDA UnitTest CI - RunPod Pod Mode (Cost Optimized)
trigger: none

variables:
  - name: RUNPOD_GPU_TYPE
    value: "NVIDIA RTX 4000 Ada Generation"
  - name: RUNPOD_IMAGE
    value: "ghcr.io/xuehaosun/azure-agent:v0.1" # 轻量级测试镜像，实际测试时替换为包含 CUDA 测试环境的镜像
  - name: POOL_NAME
    value: "RunPod-GPU-Pool"
  - name: AGENT_NAME
    value: "runpod-agent-$(Build.BuildId)"

stages:
  - stage: Start_Pod
    displayName: "GPU Tests on RunPod"
    jobs:
      - job: Start_Pod_Job
        displayName: "Launch Pod & Run CUDA Tests"
        timeoutInMinutes: 15
        pool:
          vmImage: "ubuntu-latest"

        steps:
          - checkout: none # 不需要在 agent 上 checkout 代码

          - task: Bash@3
            displayName: "Install RunPod CLI"
            inputs:
              targetType: "inline"
              script: |
                wget --quiet --show-progress https://github.com/Run-Pod/runpodctl/releases/download/v1.14.3/runpodctl-linux-amd64 -O runpodctl \
                  && chmod +x runpodctl \
                  && sudo cp runpodctl /usr/bin/runpodctl
                runpodctl config --apiKey $(RUNPOD_API_KEY)

          - task: Bash@3
            displayName: "Create RunPod & Execute Tests Inside Pod"
            name: create_and_run
            inputs:
              targetType: "inline"
              script: |
                set -e
                echo "Creating Pod..."
                runpodctl create pod \
                  --name "ci-$(Build.BuildId)" \
                  --gpuType "$(RUNPOD_GPU_TYPE)" \
                  --imageName "$(RUNPOD_IMAGE)" \
                  --communityCloud \
                  --gpuCount 1 \
                  --containerDiskSize 50 \
                  --env AZP_URL=$(System.CollectionUri) \
                  --env AZP_TOKEN=$(AZP_DEVOPS_PAT) \
                  --env AZP_POOL=$(POOL_NAME) \
                  --env AZP_AGENT_NAME=$(AGENT_NAME)

          - task: Bash@3
            displayName: "Wait for Pod to be Ready"
            name: wait_for_pod
            inputs:
              targetType: "inline"
              script: |
                MAX_RETRIES=30        # 最大重试 30 次
                SLEEP_INTERVAL=10     # 每次间隔 10 秒
                COUNT=0
                POD_ID=""

                echo "🔍 Start polling for Pod ID associated with build: ci-$(Build.BuildId)..."
                while [ -z "$POD_ID" ]; do
                  # 1. 尝试获取 Pod ID
                  POD_ID=$(runpodctl get pod | awk -v target="ci-$(Build.BuildId)" '{ for(i=1;i<=NF;i++) if($i==target) {print $1; exit} }')

                  # 2. 判断是否获取成功
                  if [ -n "$POD_ID" ]; then
                    echo "✅ Successfully found Pod ID: $POD_ID"
                    break
                  fi

                  # 3. 检查是否超时
                  COUNT=$((COUNT+1))
                  if [ $COUNT -ge $MAX_RETRIES ]; then
                    echo "❌ Timeout: Failed to find pod after $((MAX_RETRIES * SLEEP_INTERVAL)) seconds."
                    exit 1
                  fi

                  # 4. 等待后继续
                  echo "⏳ Attempt $COUNT/$MAX_RETRIES: Pod not found yet. Sleeping ${SLEEP_INTERVAL}s..."
                  sleep $SLEEP_INTERVAL
                done
                echo "##vso[task.setvariable variable=RunPodId;isOutput=true]$POD_ID"


          - task: Bash@3
            displayName: "Wait for Agent to be Online"
            name: wait_for_agent
            inputs:
              targetType: "inline"
              script: |
                # 循环检查 Agent 状态
                MAX_RETRIES=60        # 最大重试 60 次
                SLEEP_INTERVAL=10     # 每次间隔 10 秒
                count=0
                agent_online=false

                while [ $count -lt $MAX_RETRIES ]; do
                  # 查询特定名称的 Agent
                  RESPONSE=$(curl -s -u ":$AZP_DEVOPS_PAT" "$ORG_URL/_apis/distributedtask/pools/$POOL_ID/agents?agentName=$AGENT_NAME&api-version=7.0")
                  
                  # 提取状态 (status) 和 启用状态 (enabled)
                  # status 可能是: offline, online
                  CURRENT_STATUS=$(echo $RESPONSE | jq -r '.value[0].status')
                  IS_ENABLED=$(echo $RESPONSE | jq -r '.value[0].enabled')
                  
                  if [ "$CURRENT_STATUS" == "online" ]; then
                    echo "✅ Agent '$AGENT_NAME' is ONLINE and ready!"
                    agent_online=true
                    break
                  fi

                  count=$((count+1))
                  echo "⏳ Attempt $count/$MAX_RETRIES: Agent status is '${CURRENT_STATUS:-not found}'. Waiting ${SLEEP_INTERVAL}s..."
                  sleep $SLEEP_INTERVAL
                done

                if [ "$agent_online" = false ]; then
                  echo "❌ Timeout: Agent failed to come online within $((MAX_RETRIES * SLEEP_INTERVAL)) seconds."
                  echo "Possible reasons: Invalid PAT, Network issues in Pod, or Docker container failed to start."
                  exit 1
                fi

  - stage: GPU_Test
    dependsOn: Start_Pod
    jobs:
      - job: GpuTests
        timeoutInMinutes: 10
        pool:
          name: "$(POOL_NAME)"
          demands: agent.name -equals $(AGENT_NAME) # 确保只在刚才创建的那个特定 Pod 上运行
        steps:
          - checkout: self
            clean: true
            displayName: "Checkout out Repo"
          - script: |
              echo "Running on RunPod GPU!"
              nvidia-smi
              cd ${BUILD_SOURCESDIRECTORY}
              python check_torch.py
            displayName: "Run GPU Tests"

  - stage: Cleanup_Verification
    displayName: "Verify Pod Cleanup"
    dependsOn:
      - Start_Pod
      - GPU_Test
    condition: always() # 无论 GPU 测试阶段是否成功，都验证清理
    jobs:
      - job: Verify_Cleanup
        pool:
          vmImage: "ubuntu-latest"
        variables:
          PodId: $[ stageDependencies.Start_Pod.Start_Pod_Job.outputs['create_and_run.RunPodId'] ]
        steps:
          - task: Bash@3
            displayName: "Install RunPod CLI"
            inputs:
              targetType: "inline"
              script: |
                wget --quiet --show-progress https://github.com/Run-Pod/runpodctl/releases/download/v1.14.3/runpodctl-linux-amd64 -O runpodctl \
                  && chmod +x runpodctl \
                  && sudo cp runpodctl /usr/bin/runpodctl
                runpodctl config --apiKey $(RUNPOD_API_KEY)
          - script: |
              echo "Terminating Pod: $(PodId)"
              if [ -z "$TARGET_ID" ]; then
                echo "⚠️ No Pod ID found (Creation might have failed). Checking by name fallback..."
                # 备选方案：如果 ID 变量没传过来，尝试按名字查一次
                TARGET_ID=$(runpodctl get pod | awk -v target="ci-$(Build.BuildId)" '{ for(i=1;i<=NF;i++) if($i==target) {print $1; exit} }')
              fi

              if [ -n "$TARGET_ID" ]; then
                echo "🛑 Terminating Pod: $TARGET_ID"
                runpodctl remove pod "$TARGET_ID"
                runpodctl get pod $(PodId) || echo "Pod successfully terminated."
              else
                echo "⚠️ No active pod found to terminate. Skipping."
              fi
            displayName: "Terminate RunPod Instance"
